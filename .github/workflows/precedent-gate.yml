name: Precedent gate
# The v1 enforcement point (the moat): an agent-authored PR cannot auto-merge unless
# govern(diff) returns act_silently / act_and_flag. Make this a REQUIRED status check in
# branch protection so the block is enforced, not advisory.
#
# govern(diff) = corrected retrieval -> model-judged authority (match/conflict) +
# consequentiality -> deterministic risk + autonomy matrix -> verdict. The verdict is
# posted back to the PR as a comment (the escalation surface); a non-allow verdict fails
# the check and blocks the merge.
#
# pull_request_target runs this file and the engine from the base branch, so a PR cannot rewrite the
# gate, the engine or the decision store to approve itself. The PR is fetched as data (its diff) and
# none of its code is executed here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write          # to post the verdict comment

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # the base branch: the gate's own code and decisions
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/$PR_NUMBER/head:pr-head"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run govern(diff)
        id: gov
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # semantic authority step; degrades gracefully if unset
          PR_TITLE: ${{ github.event.pull_request.title }}       # via env, never pasted into the script
        run: |
          set +e
          git diff HEAD...pr-head > pr.diff
          mapfile -t paths < <(git diff --name-only HEAD...pr-head)
          python3 src/govern_cli.py --paths "${paths[@]}" --diff pr.diff --title="$PR_TITLE" > verdict.md
          echo "allow=$?" >> "$GITHUB_OUTPUT"
          cat verdict.md
      - name: Post verdict to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('verdict.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
      - name: Enforce verdict
        if: steps.gov.outputs.allow != '0'
        run: |
          echo "::error::Precedent gate blocked this merge — see the verdict comment."
          exit 1
